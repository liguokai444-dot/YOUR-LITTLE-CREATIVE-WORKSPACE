name: Build HTML Studio
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: node scripts/privacy-check.mjs --tracked
      - run: npm ci
      - run: npm run build
      - run: node --test tests/service.test.mjs
